name: Release

# Builds the plugin for a release of Atelier and publishes it in atelier-ide-org/releases, as the
# release `plugins/gltf-viewer/vX.Y.Z` (X.Y.Z: the version of the IDE it loads in, whose release is
# `app/vX.Y.Z`): `gltf-viewer.atelier-plugin`, the file Atelier installs (the manifest and the
# library of each system), and `gltf-viewer-SHA256SUMS`. It is never the "latest" release of the
# repository: that one is the IDE's, which the site links to.
#
# A native plugin loads only in the IDE it was built like (same compiler, profile and crates, see
# atelier-ide-org/api). So this workflow takes the build kit of that version of the IDE, which its
# release shares in `vX.Y.Z/` of the `kits` branch of atelier-ide-org/api (its Cargo.toml,
# Cargo.lock and rust-toolchain.toml), makes an empty package of it, puts the plugin in its
# `plugins/` folder, a member of its workspace, and runs the very command that built the IDE: the
# crates the IDE and the plugin share come out the same. The IDE never waits for its plugins: its
# release is published first, the plugin follows.
#
# Every six hours, it looks for the latest release of the IDE that has no release of this plugin
# yet. Started by hand, it builds for the version given (again, to replace its files).
#
# Secret (of the organization): ATELIER_RELEASES writes the releases of atelier-ide-org/releases.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The version of Atelier to build for (vX.Y.Z)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  PLUGIN: gltf-viewer
  LIBRARY: gltf_viewer

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          # `tag`: the version of the IDE (vX.Y.Z).
          if [ -n "$WANTED" ]; then
            tag="$WANTED"
          else
            # The latest published release of the IDE: `app/vX.Y.Z`.
            tag=$(gh release list --repo atelier-ide-org/releases --exclude-drafts --exclude-pre-releases \
                --limit 100 --json tagName --jq '.[].tagName | select(startswith("app/")) | ltrimstr("app/")' \
              | sort -V | tail -1)
            if [ -z "$tag" ]; then
              echo "No release of the IDE yet."
              exit 0
            fi
            if gh release view "plugins/$PLUGIN/$tag" --repo atelier-ide-org/releases > /dev/null 2>&1; then
              echo "$PLUGIN is already released for $tag."
              exit 0
            fi
          fi
          # The releases before native plugins (0.1.x) have no build kit.
          if ! gh api "repos/atelier-ide-org/api/contents/$tag/Cargo.lock?ref=kits" --silent 2>/dev/null; then
            echo "$tag has no build kit: nothing to build."
            [ -z "$WANTED" ] || exit 1
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: find
    if: needs.find.outputs.tag != ''
    name: build (${{ matrix.os_name }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os_name: windows, arch: x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux, arch: x86_64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, os_name: macos, arch: aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, os_name: macos, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The build kit of the IDE, made an empty package, and this plugin in its `plugins/` folder.
      - uses: actions/checkout@v7
        with:
          repository: atelier-ide-org/api
          ref: kits
          path: kits
          sparse-checkout: ${{ needs.find.outputs.tag }}
      - name: Kit
        run: |
          mkdir -p app/src
          cp -r "kits/${{ needs.find.outputs.tag }}/." app/
          echo 'fn main() {}' > app/src/main.rs
      - uses: actions/checkout@v7
        with:
          path: app/plugins/${{ env.PLUGIN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev

      # The compiler of the IDE: its rust-toolchain.toml.
      - name: Toolchain
        working-directory: app
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.target }}

      # The command of `build.yml` in the IDE, for the whole workspace: the plugin is added to the
      # lockfile (no --locked), the versions of the IDE stay as they are.
      - name: Build
        working-directory: app
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        # The library of this system, in the folder the IDE looks in: `<os>-<arch>/`.
        run: |
          case "${{ matrix.os_name }}" in
            windows) file="$LIBRARY.dll" ;;
            macos) file="lib$LIBRARY.dylib" ;;
            *) file="lib$LIBRARY.so" ;;
          esac
          dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$dir"
          cp "app/target/${{ matrix.target }}/release/$file" "$dir/"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [find, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/download-artifact@v8
        with:
          path: stage
          merge-multiple: true
      # One file for every system: `gltf-viewer.atelier-plugin`, a zip of the manifest (with the
      # version of Atelier it is built for) and of the library of each system. Atelier installs it
      # with Plugins › Install a plugin from a file.
      - name: Package
        env:
          VERSION: ${{ needs.find.outputs.tag }}
        run: |
          jq --arg v "${VERSION#v}" '. + { atelier: $v }' plugin/plugin.json > stage/plugin.json
          mkdir -p dist
          (cd stage && zip -r "../dist/$PLUGIN.atelier-plugin" .)
          unzip -l "dist/$PLUGIN.atelier-plugin"
          (cd dist && sha256sum "$PLUGIN.atelier-plugin" > "$PLUGIN-SHA256SUMS" && cat "$PLUGIN-SHA256SUMS")
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.ATELIER_RELEASES }}
          VERSION: ${{ needs.find.outputs.tag }}
        run: |
          tag="plugins/$PLUGIN/$VERSION"
          plugin_version="$(sed -n 's/^version = "\(.*\)"/\1/p' plugin/Cargo.toml | head -1)"
          name="$(jq -r .name plugin/plugin.json)"
          cd dist
          if gh release view "$tag" --repo atelier-ide-org/releases > /dev/null 2>&1; then
            gh release upload "$tag" ./* --clobber --repo atelier-ide-org/releases
            exit 0
          fi
          printf '%s\n' \
            "$name $plugin_version ($PLUGIN), built for **Atelier ${VERSION#v}** (release \`app/$VERSION\`): it loads in that version of the IDE only." \
            "" \
            "Download \`$PLUGIN.atelier-plugin\`, then in Atelier open **Plugins** and click **Install a plugin from a file** (the + button). It is installed once, for every project." \
            > ../notes.md
          gh release create "$tag" ./* --repo atelier-ide-org/releases --latest=false \
            --title "$name $plugin_version for Atelier ${VERSION#v}" --notes-file ../notes.md
