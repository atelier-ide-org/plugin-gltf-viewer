name: Release

# Builds the plugin for a release of Atelier and publishes it in atelier-ide-org/releases, as the
# release `plugins/gltf-viewer/vX.Y.Z` (X.Y.Z: the version of the IDE it loads in, whose release is
# `app/vX.Y.Z`): `gltf-viewer-<os>-<arch>.zip` / `.tar.gz` (the manifest and the library) and
# `gltf-viewer-SHA256SUMS`. It is never the "latest" release of the repository: that one is the
# IDE's, which the site links to.
#
# A native plugin loads only in the IDE it was built like (same compiler, profile and crates, see
# atelier-ide-org/plugin-api). So this workflow takes the code of the IDE at the tag of the
# release, puts the plugin in its `plugins/` folder, a member of its workspace, and runs the very
# command that built the IDE: the crates the IDE and the plugin share come out the same. The IDE
# never waits for its plugins: its release is published first, the plugin follows.
#
# Every six hours, it looks for the latest release of the IDE that has no release of this plugin
# yet. Started by hand, it builds for the version given (again, to replace its files).
#
# Secrets (of the organization): READ_TOKEN reads atelier-ide-org/app, which is private;
# RELEASES_TOKEN writes the releases of atelier-ide-org/releases.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The version of Atelier to build for (vX.Y.Z)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  PLUGIN: gltf-viewer
  LIBRARY: gltf_viewer

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          WANTED: ${{ inputs.tag }}
        run: |
          # `tag`: the version of the IDE (vX.Y.Z), which is also its tag in atelier-ide-org/app.
          if [ -n "$WANTED" ]; then
            tag="$WANTED"
          else
            # The latest published release of the IDE: `app/vX.Y.Z`.
            tag=$(gh release list --repo atelier-ide-org/releases --exclude-drafts --exclude-pre-releases \
                --limit 100 --json tagName --jq '.[].tagName | select(startswith("app/")) | ltrimstr("app/")' \
              | sort -V | tail -1)
            if [ -z "$tag" ]; then
              echo "No release of the IDE yet."
              exit 0
            fi
            if gh release view "plugins/$PLUGIN/$tag" --repo atelier-ide-org/releases > /dev/null 2>&1; then
              echo "$PLUGIN is already released for $tag."
              exit 0
            fi
          fi
          # The releases before native plugins (0.1.x) have no rust-toolchain.toml.
          if ! GH_TOKEN="$READ_TOKEN" gh api "repos/atelier-ide-org/app/contents/rust-toolchain.toml?ref=$tag" --silent 2>/dev/null; then
            echo "$tag has no native plugins: nothing to build."
            [ -z "$WANTED" ] || exit 1
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: find
    if: needs.find.outputs.tag != ''
    name: build (${{ matrix.os_name }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os_name: windows, arch: x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux, arch: x86_64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, os_name: macos, arch: aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, os_name: macos, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The IDE at the tag of the release, and this plugin in its `plugins/` folder.
      - uses: actions/checkout@v7
        with:
          repository: atelier-ide-org/app
          ref: ${{ needs.find.outputs.tag }}
          token: ${{ secrets.READ_TOKEN }}
          path: app
      - uses: actions/checkout@v7
        with:
          path: app/plugins/${{ env.PLUGIN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev

      # The compiler of the IDE: its rust-toolchain.toml.
      - name: Toolchain
        working-directory: app
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.target }}

      # The command of `build.yml` in the IDE, for the whole workspace: the plugin is added to the
      # lockfile (no --locked), the versions of the IDE stay as they are.
      - name: Build
        working-directory: app
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        run: |
          case "${{ matrix.os_name }}" in
            windows) file="$LIBRARY.dll" ;;
            macos) file="lib$LIBRARY.dylib" ;;
            *) file="lib$LIBRARY.so" ;;
          esac
          name="$PLUGIN-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p dist/stage
          cp "app/plugins/$PLUGIN/plugin.json" "app/target/${{ matrix.target }}/release/$file" dist/stage/
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            (cd dist/stage && 7z a -tzip "../$name.zip" ./*)
          else
            tar -czf "dist/$name.tar.gz" -C dist/stage .
          fi
          rm -r dist/stage

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [find, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.find.outputs.tag }}
        run: |
          tag="plugins/$PLUGIN/$VERSION"
          plugin_version="$(sed -n 's/^version = "\(.*\)"/\1/p' plugin/Cargo.toml | head -1)"
          name="$(jq -r .name plugin/plugin.json)"
          cd dist
          sha256sum "$PLUGIN"-* > "$PLUGIN-SHA256SUMS"
          cat "$PLUGIN-SHA256SUMS"
          if gh release view "$tag" --repo atelier-ide-org/releases > /dev/null 2>&1; then
            gh release upload "$tag" ./* --clobber --repo atelier-ide-org/releases
            exit 0
          fi
          printf '%s\n' \
            "$name $plugin_version ($PLUGIN), built for **Atelier ${VERSION#v}** (release \`app/$VERSION\`): it loads in that version of the IDE only." \
            "" \
            "Extract \`$PLUGIN-<os>-<arch>\` into \`.atelier/plugins/$PLUGIN/\` of your project, then in Atelier open **Plugins**, click **Reload** and enable it." \
            > ../notes.md
          gh release create "$tag" ./* --repo atelier-ide-org/releases --latest=false \
            --title "$name $plugin_version for Atelier ${VERSION#v}" --notes-file ../notes.md
